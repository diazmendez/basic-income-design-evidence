   <g id="text_1">
    <text style="font: 700 8.5px 'DejaVu Sans'; text-anchor: start" x="16.338735" y="19.478469" transform="rotate(-0 16.338735 19.478469)">A  Comparison-level evidence audit (applied to one comparison at a time)</text>
   </g>
   <g id="text_2">
    <text style="font: 700 8px 'DejaVu Sans'; text-anchor: middle" x="65.929618" y="51.92074" transform="rotate(-0 65.929618 51.92074)">Variation</text>
   </g>
   <g id="text_3">
    <text style="font: 6px 'DejaVu Sans'" transform="translate(44.654461 67.694738)">feature differs</text>
    <text style="font: 6px 'DejaVu Sans'" transform="translate(47.079774 74.413425)">between the</text>
    <text style="font: 6px 'DejaVu Sans'" transform="translate(39.635086 81.132113)">compared groups</text>
   </g>
   <g id="text_4">
    <text style="fill: #444444; font: 6.2px 'DejaVu Sans'" transform="translate(43.571352 104.769491)">Typical failure:</text>
    <text style="fill: #444444; font: 6.2px 'DejaVu Sans'" transform="translate(24.97329 111.712134)">no difference documented</text>
   </g>
