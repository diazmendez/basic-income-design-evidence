   </g>
   <g id="text_6">
    <text style="font: 6px 'DejaVu Sans'" transform="translate(142.670031 67.694738)">no other feature</text>
    <text style="font: 6px 'DejaVu Sans'" transform="translate(143.243312 74.413425)">changes, or it is</text>
    <text style="font: 6px 'DejaVu Sans'" transform="translate(152.375031 81.132113)">held fixed</text>
   </g>
   <g id="text_7">
    <text style="fill: #444444; font: 6.2px 'DejaVu Sans'" transform="translate(144.777234 104.769491)">Typical failure:</text>
