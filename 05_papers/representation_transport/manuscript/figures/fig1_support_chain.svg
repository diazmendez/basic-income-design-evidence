    <text style="font: 700 8px 'DejaVu Sans'" transform="translate(185.133131 53.38762)">Compatible</text>
    <text style="font: 700 8px 'DejaVu Sans'" transform="translate(189.823131 62.34587)">estimand</text>
   </g>
   <g id="text_8">
    <text style="font: 6px 'DejaVu Sans'" transform="translate(191.815318 76.863811)">employment</text>
    <text style="font: 6px 'DejaVu Sans'" transform="translate(180.907506 83.582498)">probability reported</text>
    <text style="font: 6px 'DejaVu Sans'" transform="translate(181.137662 90.301186)">for that comparison</text>
   </g>
   <g id="text_9">
    <text style="fill: #444444; font: 6.3px 'DejaVu Sans'" transform="translate(188.059248 115.10632)">Typical failure:</text>
