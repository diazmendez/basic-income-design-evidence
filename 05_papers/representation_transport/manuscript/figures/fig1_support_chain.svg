   <g id="text_5">
    <text style="font: 6px 'DejaVu Sans'" transform="translate(107.372074 76.863811)">no other feature</text>
    <text style="font: 6px 'DejaVu Sans'" transform="translate(107.945355 83.582498)">changes, or it is</text>
