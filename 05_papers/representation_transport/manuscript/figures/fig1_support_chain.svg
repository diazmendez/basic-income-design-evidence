   <g id="text_10">
    <text style="font: 700 8px 'DejaVu Sans'" transform="translate(274.443094 53.35637)">Usable</text>
    <text style="font: 700 8px 'DejaVu Sans'" transform="translate(263.617469 62.31462)">uncertainty</text>
   </g>
   <g id="text_11">
    <text style="font: 6px 'DejaVu Sans'" transform="translate(262.417781 80.223154)">published SE or CI</text>
    <text style="font: 6px 'DejaVu Sans'" transform="translate(264.394031 86.941842)">for that estimate</text>
   </g>
   <g id="text_12">
    <text style="fill: #444444; font: 6.3px 'DejaVu Sans'" transform="translate(266.999836 115.10632)">Typical failure:</text>
    <text style="fill: #444444; font: 6.3px 'DejaVu Sans'" transform="translate(264.092977 122.160941)">stars, p-value or</text>
    <text style="fill: #444444; font: 6.3px 'DejaVu Sans'" transform="translate(272.151563 129.215563)">verbal only</text>
   </g>
   <g id="text_13">
    <text style="font: 700 8px 'DejaVu Sans'" transform="translate(354.156881 53.38762)">Independent</text>
    <text style="font: 700 8px 'DejaVu Sans'" transform="translate(360.337506 62.34587)">validation</text>
   </g>
   <g id="text_14">
    <text style="font: 6px 'DejaVu Sans'" transform="translate(369.336568 73.504467)">a second</text>
    <text style="font: 6px 'DejaVu Sans'" transform="translate(353.650787 80.223154)">independent family</text>
    <text style="font: 6px 'DejaVu Sans'" transform="translate(357.551256 86.941842)">passes the same</text>
    <text style="font: 6px 'DejaVu Sans'" transform="translate(365.957818 93.660529)">four stages</text>
   </g>
   <g id="text_15">
    <text style="fill: #444444; font: 6.3px 'DejaVu Sans'" transform="translate(360.109248 118.633631)">Typical failure:</text>
    <text style="fill: #444444; font: 6.3px 'DejaVu Sans'" transform="translate(362.04256 125.688252)">single source</text>
   </g>
   <g id="text_16">
    <text style="font: 700 7.5px 'DejaVu Sans'; text-anchor: middle" x="171.307836" y="25.091389" transform="rotate(-0 171.307836 25.091389)">Comparison-level support stages (V → I → E → U)</text>
   </g>
   <g id="text_17">
    <text style="font: italic 7px 'DejaVu Sans'" transform="translate(348.742506 21.063483)">Requirement of the</text>
    <text style="font: italic 7px 'DejaVu Sans'" transform="translate(354.499459 28.901952)">prospective test</text>
   </g>
   <g id="text_18">
    <text style="font: italic 6.6px 'DejaVu Sans'" transform="translate(7.2 150.250754)">The four stages are evaluated on one comparison at a time. Independent validation is not a fifth stage: it is a requirement of this</text>
    <text style="font: italic 6.6px 'DejaVu Sans'" transform="translate(33.483469 157.641311)">prospective test (one family for discovery, one for validation). Operational audit criteria, not a new causal theory.</text>
   </g>
  </g>
