    <text style="font: 700 8px 'DejaVu Sans'" transform="translate(354.27164 47.410365)">Usable</text>
    <text style="font: 700 8px 'DejaVu Sans'" transform="translate(343.446015 56.368615)">uncertainty</text>
   </g>
   <g id="text_12">
    <text style="font: 6px 'DejaVu Sans'" transform="translate(342.246327 71.054081)">published SE or CI</text>
    <text style="font: 6px 'DejaVu Sans'" transform="translate(344.222577 77.772769)">for that estimate</text>
   </g>
   <g id="text_13">
    <text style="fill: #444444; font: 6.2px 'DejaVu Sans'" transform="translate(347.188999 101.298169)">Typical failure:</text>
    <text style="fill: #444444; font: 6.2px 'DejaVu Sans'" transform="translate(344.32828 108.240812)">stars, p-value or</text>
    <text style="fill: #444444; font: 6.2px 'DejaVu Sans'" transform="translate(352.258952 115.183456)">verbal only</text>
   </g>
   <g id="text_14">
    <text style="font: 700 8.5px 'DejaVu Sans'; text-anchor: start" x="16.338735" y="144.601066" transform="rotate(-0 16.338735 144.601066)">B  Project-specific requirement of the prospective test (not a fifth stage)</text>
   </g>
   <g id="text_15">
    <text style="font: 700 8px 'DejaVu Sans'; text-anchor: middle" x="117.544618" y="169.09889" transform="rotate(-0 117.544618 169.09889)">Independent family 1</text>
   </g>
   <g id="text_16">
    <text style="font: 6.3px 'DejaVu Sans'" transform="translate(78.410297 179.883144)">a comparison that clears</text>
    <text style="font: 6.3px 'DejaVu Sans'" transform="translate(77.21379 186.937766)">all four stages of panel A,</text>
    <text style="font: 6.3px 'DejaVu Sans'" transform="translate(64.835766 193.992388)">used for discovery / identification</text>
   </g>
   <g id="text_17">
    <text style="font: 700 8px 'DejaVu Sans'; text-anchor: middle" x="307.811676" y="169.09889" transform="rotate(-0 307.811676 169.09889)">Independent family 2</text>
   </g>
   <g id="text_18">
    <text style="font: 6.3px 'DejaVu Sans'" transform="translate(268.677356 179.883144)">a comparison that clears</text>
    <text style="font: 6.3px 'DejaVu Sans'" transform="translate(267.480848 186.937766)">all four stages of panel A,</text>
    <text style="font: 6.3px 'DejaVu Sans'" transform="translate(262.804083 193.992388)">used for empirical validation</text>
   </g>
   <g id="text_19">
    <text style="font: 700 12px 'DejaVu Sans'; text-anchor: middle" x="218.7505" y="182.55081" transform="rotate(-0 218.7505 182.55081)">+</text>
   </g>
   <g id="text_20">
    <text style="font: italic 6.4px 'DejaVu Sans'" transform="translate(36.55 225.8953)">Panel B is a feasibility rule for this test only, not a property of a single comparison and not a general condition for</text>
    <text style="font: italic 6.4px 'DejaVu Sans'" transform="translate(7.2 233.0619)">transportability: formal transport can use one source under stated assumptions. Operational audit criteria, not a new causal theory.</text>
   </g>
