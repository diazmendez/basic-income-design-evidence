   </g>
   <g id="text_2">
    <text style="font: 6px 'DejaVu Sans'" transform="translate(31.621798 76.863811)">feature differs</text>
    <text style="font: 6px 'DejaVu Sans'" transform="translate(34.04711 83.582498)">between the</text>
    <text style="font: 6px 'DejaVu Sans'" transform="translate(26.602423 90.301186)">compared groups</text>
   </g>
   <g id="text_3">
    <text style="fill: #444444; font: 6.3px 'DejaVu Sans'" transform="translate(30.178071 118.633631)">Typical failure:</text>
